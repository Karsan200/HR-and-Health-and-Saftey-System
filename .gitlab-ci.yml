workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test

cache:
  key: gradle-cache-key
  paths:
    - .gradle/wrapper
    - .gradle/caches
  policy: pull-push

backend:build:
  image: eclipse-temurin:21-jdk
  stage: build
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew build
  artifacts:
    paths:
      - backend/build/libs/*.jar

backend:test:
  image: eclipse-temurin:21-jdk
  stage: test
  needs:
    - backend:build
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew check
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - backend/build/reports/tests/
      - backend/build/reports/checkstyle/
      - backend/build/jacocoHtml/
      - backend/build/jacoco/test.exec
      - backend/build/reports/jacoco/test/jacocoTestReport.xml
    reports:
      coverage_report:
        coverage_format: jacoco
        path: backend/build/reports/jacoco/test/jacocoTestReport.xml
      junit: backend/build/test-results/test/TEST-*.xml
    expire_in: 4 week

frontend:mobile:test:
  image: node:20-bullseye
  stage: test
  cache:
    key:
      files:
        - frontend-mobile/package-lock.json
    paths:
      - frontend-mobile/node_modules/
    policy: pull-push
  script:
    - cd frontend-mobile
    - npm ci
    - npm run lint
    - npm test -- --coverage --ci --maxWorkers=2
  artifacts:
    when: always
    paths:
      - frontend-mobile/coverage/
      - frontend-mobile/coverage/cobertura-coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend-mobile/coverage/cobertura-coverage.xml
    expire_in: 4 week
